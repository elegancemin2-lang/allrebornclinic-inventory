<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE KING GYM</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
.spinner{width:34px;height:34px;border:3px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="spinner"></div><b>THE KING GYM</b><p>앱을 불러오는 중입니다.</p></div></div>
<script>
(async()=>{
 try{
   const r=await fetch('https://wjzadmeshuxgsidjlgui.supabase.co/functions/v1/theking-gym?app=1',{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status);
   const h=await r.text();
   document.open();
   document.write(h);
   document.close();
 }catch(e){
   document.body.innerHTML='<div class="wrap"><div class="card"><b>앱 연결 실패</b><p>'+String(e)+'</p></div></div>';
 }
})();
</script>
</body>
</html>
