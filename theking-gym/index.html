<style>
:root{--bg:#f5f5f7;--card:rgba(255,255,255,.88);--ink:#111114;--muted:#707078;--line:#e7e7eb;--blue:#0a84ff;--green:#34c759;--orange:#ff9f0a;--red:#ff453a;--purple:#7c5cff;--shadow:0 14px 44px rgba(21,21,27,.08);--radius:26px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}button,input,textarea,select{font:inherit}button{cursor:pointer}body:before{content:"";position:fixed;inset:-20vh -20vw auto;height:55vh;background:radial-gradient(circle at 20% 30%,rgba(10,132,255,.12),transparent 36%),radial-gradient(circle at 80% 15%,rgba(124,92,255,.12),transparent 34%);pointer-events:none;z-index:-1}.hidden{display:none!important}.shell{min-height:100vh;max-width:1500px;margin:0 auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(245,245,247,.8);backdrop-filter:blur(18px);z-index:20;border-bottom:1px solid rgba(0,0,0,.04)}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:-.7px}.mark{width:35px;height:35px;border-radius:12px;background:linear-gradient(145deg,#111,#35353b);color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.18)}.rolepill{font-size:12px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}.top-actions{display:flex;align-items:center;gap:9px}.iconbtn{border:0;background:#fff;width:40px;height:40px;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.05);position:relative}.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--red);right:7px;top:6px;border:2px solid white}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;padding:24px 28px 48px}.side{position:sticky;top:100px;height:calc(100vh - 120px);display:flex;flex-direction:column;gap:6px}.navbtn{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:15px;color:#55555d;font-weight:700}.navbtn.active{background:#fff;color:#111;box-shadow:0 7px 22px rgba(0,0,0,.055)}.navbtn small{display:block;color:#a0a0a8;font-weight:500;margin-top:2px}.side-foot{margin-top:auto;padding:16px;border-radius:20px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8)}.side-foot b{display:block;font-size:13px}.side-foot span{font-size:12px;color:var(--muted)}.main{min-width:0}.headline{display:flex;justify-content:space-between;align-items:end;margin:10px 0 24px}.headline h1{font-size:34px;line-height:1.05;margin:0;letter-spacing:-1.4px}.headline p{margin:7px 0 0;color:var(--muted);font-size:14px}.date{font-size:13px;color:var(--muted)}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid rgba(255,255,255,.75);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:20px}.metric{min-height:122px}.metric label{font-size:12px;color:var(--muted);font-weight:700}.metric strong{display:block;font-size:29px;margin-top:13px;letter-spacing:-1px}.metric small{font-size:12px;color:var(--muted)}.accent{background:linear-gradient(145deg,#19191d,#2c2c33);color:#fff}.accent label,.accent small{color:#a9a9b0}.two{grid-template-columns:1.2fr .8fr}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-title h2{margin:0;font-size:18px;letter-spacing:-.5px}.section-title span{font-size:12px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:#f8f8fa;border:1px solid #efeff2}.avatar{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#e9e9ee,#fff);display:grid;place-items:center;font-weight:800;color:#444}.row-main{min-width:0;flex:1}.row-main b{font-size:14px}.row-main div{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#ececf0;color:#606069}.badge.green{background:#e9f9ed;color:#248a3d}.badge.orange{background:#fff2dd;color:#b66400}.badge.red{background:#ffe9e7;color:#cc2d25}.badge.blue{background:#e7f2ff;color:#0068d9}.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:800;background:#111;color:#fff}.btn.secondary{background:#fff;color:#222;border:1px solid var(--line)}.btn.blue{background:var(--blue)}.btn.red{background:#fff0ef;color:#d93025}.btn.sm{padding:8px 10px;border-radius:11px;font-size:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid #dfdfe5;background:#fff;border-radius:14px;padding:12px 13px;outline:none;color:#111}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a8cbff;box-shadow:0 0 0 4px rgba(10,132,255,.09)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.span2{grid-column:1/-1}.progress{height:8px;background:#ececf0;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple))}.schedule-day{font-size:12px;font-weight:800;color:var(--muted);margin:16px 4px 7px}.schedule{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:10px;padding:13px 12px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:8px}.time{font-weight:850}.schedule .who b{font-size:14px}.schedule .who div{font-size:12px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.notice{padding:13px;border-radius:16px;background:#f7f7f9;border:1px solid var(--line);margin-bottom:8px}.notice.unread{background:#eef6ff;border-color:#d9eaff}.notice b{font-size:13px}.notice p{font-size:12px;color:var(--muted);margin:4px 0 0}.tablewrap{overflow:auto;border-radius:18px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}th,td{padding:12px;border-bottom:1px solid #efeff2;text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);background:#fafafd;position:sticky;top:0}.empty{padding:36px 10px;text-align:center;color:var(--muted);font-size:13px}.empty b{display:block;color:#333;margin-bottom:5px}.bottom{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.24);backdrop-filter:blur(8px);z-index:80;display:grid;place-items:end center;padding:18px}.sheet{width:min(600px,100%);max-height:86vh;overflow:auto;background:#f8f8fa;border-radius:30px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.sheet h3{margin:0 0 16px;font-size:22px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#e9e9ed;width:34px;height:34px;border-radius:50%}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(430px,100%);padding:30px;background:rgba(255,255,255,.9);border:1px solid white;border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.11);backdrop-filter:blur(22px)}.loginbox .logo{width:58px;height:58px;border-radius:20px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:24px}.loginbox h1{font-size:29px;margin:0;letter-spacing:-1px}.loginbox p{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 22px}.loginbox .field{margin-bottom:10px}.loginbox .btn{width:100%;padding:13px;margin-top:5px}.hint{margin-top:15px;font-size:11px;color:#999;text-align:center}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);padding:11px 15px;background:rgba(20,20,24,.92);color:#fff;border-radius:14px;font-size:12px;z-index:200;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:900}.big{font-size:40px;font-weight:900;letter-spacing:-2px;margin:4px 0}.soft{color:var(--muted);font-size:12px}.split{display:flex;align-items:center;justify-content:space-between;gap:10px}.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--p,65%),#e8e8ed 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}.ring span{z-index:1;font-weight:900}
@media(max-width:900px){.top{height:65px;padding:0 18px}.layout{display:block;padding:16px 14px 96px}.side{display:none}.headline{margin:8px 2px 18px}.headline h1{font-size:28px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.card{border-radius:23px;padding:16px}.metric{min-height:110px}.metric strong{font-size:26px}.bottom{display:flex;position:fixed;left:10px;right:10px;bottom:calc(9px + env(safe-area-inset-bottom));z-index:40;background:rgba(250,250,252,.9);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.85);box-shadow:0 15px 45px rgba(0,0,0,.15);border-radius:24px;padding:7px;justify-content:space-around}.bottom button{border:0;background:transparent;color:#85858d;font-size:10px;font-weight:700;min-width:58px;padding:7px 4px;border-radius:16px}.bottom button i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}.bottom button.active{background:#fff;color:#111;box-shadow:0 4px 15px rgba(0,0,0,.07)}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.schedule{grid-template-columns:58px 1fr}.schedule .actions{grid-column:1/-1;justify-content:flex-start;padding-left:68px}.top .rolepill{display:none}.top-actions .usertext{display:none}.sheet{border-radius:28px 28px 20px 20px}.tablewrap{margin-left:-2px;margin-right:-2px}}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="logo">TK</div><div class="kicker">THE KING GYM</div><h1 id="loginTitle">다시 오신 걸 환영합니다.</h1><p id="loginDesc">한 번 로그인하면 이 기기에서 로그인 상태를 유지합니다.</p><div class="field"><label>아이디</label><input id="loginId" autocomplete="username" placeholder="아이디"></div><div class="field"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호"></div><div class="field setupOnly hidden"><label>관리자 이름</label><input id="setupName" placeholder="예: 더킹짐 관리자"></div><button class="btn" id="loginBtn" onclick="doLogin()">로그인</button><div class="hint">THE KING GYM · Secure Server</div></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand"><div class="mark">TK</div><span>THE KING GYM</span><span class="rolepill" id="rolePill"></span></div><div class="top-actions"><span class="usertext" id="userText" style="font-size:12px;color:#777"></span><button class="iconbtn" onclick="openNotifications()">♢<span id="notifyDot" class="dot hidden"></span></button><button class="iconbtn" onclick="openProfile()">•••</button></div></header><div class="layout"><aside class="side" id="sideNav"></aside><main class="main" id="main"></main></div><nav class="bottom" id="bottomNav"></nav></div>
<div class="toast" id="toast"></div><div class="modal hidden" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const API='https://wjzadmeshuxgsidjlgui.supabase.co/functions/v1/theking-gym';let TOKEN=localStorage.getItem('tk_session')||'',DATA=null,ACTIVE='home',SETUP=false;const $=id=>document.getElementById(id);const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';const day=s=>new Date(s).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});const hm=s=>new Date(s).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-session':TOKEN},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({error:'서버 응답 오류'}));if(!r.ok){if(j.code==='UNAUTH')logoutLocal();throw new Error(j.error||'오류가 발생했습니다.')}return j}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
async function boot(){try{const st=await api('setup_status');SETUP=st.needs_setup;if(SETUP){$('loginTitle').textContent='더킹짐을 시작해볼까요?';$('loginDesc').textContent='최초 관리자 계정을 한 번만 생성하면 됩니다.';document.querySelector('.setupOnly').classList.remove('hidden');$('loginBtn').textContent='관리자 계정 만들기'}if(TOKEN&&!SETUP){await load();showApp()}else $('login').classList.remove('hidden')}catch(e){toast(e.message)}}async function doLogin(){try{const username=$('loginId').value.trim(),password=$('loginPw').value;if(SETUP){await api('setup_admin',{username,password,display_name:$('setupName').value.trim()||'더킹짐 관리자'});SETUP=false;document.querySelector('.setupOnly').classList.add('hidden');$('loginTitle').textContent='관리자 계정이 생성됐어요.';$('loginDesc').textContent='지금 만든 계정으로 로그인해주세요.';$('loginBtn').textContent='로그인';toast('관리자 설정 완료');return}const r=await api('login',{username,password});TOKEN=r.token;localStorage.setItem('tk_session',TOKEN);await load();showApp()}catch(e){toast(e.message)}}async function load(){DATA=await api('snapshot');renderNav();render()}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('rolePill').textContent=roleName(DATA.user.role);$('userText').textContent=DATA.user.display_name;updateNotify()}function roleName(r){return r==='admin'?'관리자':r==='trainer'?'트레이너':'회원'}
function tabs(){if(DATA.user.role==='admin')return[['home','⌂','운영'],['schedule','◷','스케줄'],['people','◎','회원'],['salary','₩','급여'],['approval','✓','승인']];if(DATA.user.role==='trainer')return[['home','⌂','오늘'],['schedule','◷','스케줄'],['people','◎','회원'],['notes','▤','일지'],['salary','₩','MY']];return[['home','⌂','홈'],['schedule','◷','스케줄'],['notes','▤','수업'],['qna','?','Q&A'],['my','◎','MY']]}function renderNav(){const ts=tabs();$('sideNav').innerHTML=ts.map(t=>'<button class="navbtn '+(ACTIVE===t[0]?'active':'')+'" onclick="go(\\''+t[0]+'\\')">'+t[1]+' &nbsp;'+t[2]+'<small>'+navSub(t[0])+'</small></button>').join('')+'<div class="side-foot"><b>'+esc(DATA.user.display_name)+'</b><span>'+roleName(DATA.user.role)+' · 서버 동기화</span></div>';$('bottomNav').innerHTML=ts.map(t=>'<button class="'+(ACTIVE===t[0]?'active':'')+'" onclick="go(\\''+t[0]+'\\')"><i>'+t[1]+'</i>'+t[2]+'</button>').join('')}function navSub(k){return({home:'오늘 필요한 것만',schedule:'예약·완료·취소',people:'담당회원 관리',salary:'수업수·예상급여',approval:'수정요청 관리',notes:'수업내용 공유',qna:'수업별 질문',my:'내 이용현황'})[k]||''}function go(k){ACTIVE=k;renderNav();render();scrollTo({top:0,behavior:'smooth'})}
function headline(title,sub){return'<div class="headline"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="date">'+new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})+'</div></div>'}function updateNotify(){const n=(DATA.notifications||[]).filter(x=>!x.read_at).length;$('notifyDot').classList.toggle('hidden',!n)}function remaining(m){return Number(m.total_sessions)-Number(m.used_sessions)-Number(m.locked_sessions)}function memberName(id){return DATA.members.find(x=>x.id===id)?.name||'회원'}function trainerName(id){return DATA.trainers.find(x=>x.id===id)?.name||'트레이너'}function statusBadge(s){const map={scheduled:['예정','blue'],completed:['완료','green'],cancelled:['취소',''],cancelled_late:['당일취소','orange'],no_show:['노쇼','red']};const a=map[s]||[s,''];return'<span class="badge '+a[1]+'">'+a[0]+'</span>'}function render(){if(!DATA)return;if(ACTIVE==='home')return renderHome();if(ACTIVE==='schedule')return renderSchedule();if(ACTIVE==='people')return renderPeople();if(ACTIVE==='salary')return renderSalary();if(ACTIVE==='approval')return renderApproval();if(ACTIVE==='notes')return renderNotes();if(ACTIVE==='qna')return renderQna();if(ACTIVE==='my')return renderMemberMy()}function todaySchedules(){const now=new Date();return DATA.schedules.filter(s=>new Date(s.start_at).toDateString()===now.toDateString())}function upcoming(){return DATA.schedules.filter(s=>s.status==='scheduled'&&new Date(s.start_at)>new Date()).slice(0,8)}
function renderHome(){const r=DATA.user.role;if(r==='admin'){const today=todaySchedules(),low=DATA.members.filter(m=>remaining(m)<=3).length,pending=DATA.change_requests.filter(x=>x.status==='pending').length,unread=DATA.notifications.filter(x=>!x.read_at).length;$('main').innerHTML=headline('센터가 한눈에 보여요.','스케줄·회원·승인·급여를 같은 데이터로 관리합니다.')+'<div class="grid metrics"><div class="card metric accent"><label>오늘 PT</label><strong>'+today.length+'건</strong><small>전체 트레이너</small></div><div class="card metric"><label>잔여 3회 이하</label><strong>'+low+'명</strong><small>재등록 확인 필요</small></div><div class="card metric"><label>수정 승인 대기</label><strong>'+pending+'건</strong><small>트레이너 요청</small></div><div class="card metric"><label>읽지 않은 알림</label><strong>'+unread+'개</strong><small>운영 알림</small></div></div><div class="grid two"><div class="card"><div class="section-title"><h2>오늘 스케줄</h2><span onclick="go(\\'schedule\\')" style="cursor:pointer">전체보기 ›</span></div>'+scheduleList(today)+'</div><div class="card"><div class="section-title"><h2>트레이너 현황</h2><span>이번 달</span></div>'+salaryMini()+'</div></div>'}else if(r==='trainer'){const sal=DATA.salary[0]||{},today=todaySchedules(),low=DATA.members.filter(m=>remaining(m)<=3).length;$('main').innerHTML=headline(DATA.user.display_name+'님, 오늘도 깔끔하게.','수업 처리와 회원 기록에만 집중하세요.')+'<div class="grid metrics"><div class="card metric accent"><label>오늘 수업</label><strong>'+today.length+'건</strong><small>예정 포함</small></div><div class="card metric"><label>이번달 인정수업</label><strong>'+(sal.paid_sessions||0)+'회</strong><small>급여 계산 기준</small></div><div class="card metric"><label>담당회원</label><strong>'+DATA.members.length+'명</strong><small>잔여 3회 이하 '+low+'명</small></div><div class="card metric"><label>예상급여</label><strong style="font-size:23px">'+won(sal.estimated_salary||0)+'</strong><small>현재 설정 기준</small></div></div><div class="grid two"><div class="card"><div class="section-title"><h2>오늘 PT</h2><span>완료하면 회차가 확정됩니다</span></div>'+scheduleList(today,true)+'</div><div class="card"><div class="section-title"><h2>재등록 체크</h2><span>잔여 3회 이하</span></div>'+memberMini(DATA.members.filter(m=>remaining(m)<=3))+'</div></div>'}else{const m=DATA.members[0];const next=upcoming()[0];const rem=m?remaining(m):0;const p=m&&m.total_sessions?Math.round((m.used_sessions/m.total_sessions)*100):0;$('main').innerHTML=headline(DATA.user.display_name+'님의 PT','예약과 수업기록을 한 곳에서 확인하세요.')+'<div class="grid two"><div class="card accent"><div class="kicker" style="color:#aaa">NEXT SESSION</div><div class="big">'+(next?hm(next.start_at):'—')+'</div><div style="font-weight:800">'+(next?day(next.start_at):'예약된 수업이 없습니다')+'</div><div class="soft" style="margin-top:6px">'+(next?trainerName(next.trainer_id)+' · '+esc(next.title||'PT'):'트레이너와 일정을 잡아보세요')+'</div>'+(next?memberCancelButton(next):'')+'</div><div class="card"><div class="split"><div><div class="kicker">PT BALANCE</div><div class="big">'+rem+'회</div><div class="soft">사용 '+m.used_sessions+' · 예약 '+m.locked_sessions+' · 총 '+m.total_sessions+'</div></div><div class="ring" style="--p:'+p+'%"><span>'+p+'%</span></div></div></div></div><div class="card" style="margin-top:14px"><div class="section-title"><h2>다가오는 수업</h2><span onclick="go(\\'schedule\\')" style="cursor:pointer">전체보기 ›</span></div>'+scheduleList(upcoming().slice(0,4))+'</div>'}}
function memberMini(arr){if(!arr.length)return'<div class="empty"><b>여유 있어요</b>잔여 3회 이하 회원이 없습니다.</div>';return'<div class="list">'+arr.map(m=>'<div class="row"><div class="avatar">'+esc(m.name[0])+'</div><div class="row-main"><b>'+esc(m.name)+'</b><div>사용 '+m.used_sessions+' · 예약 '+m.locked_sessions+' · 총 '+m.total_sessions+'</div></div><span class="badge '+(remaining(m)<=1?'red':'orange')+'">'+remaining(m)+'회</span></div>').join('')+'</div>'}function salaryMini(){if(!DATA.salary.length)return'<div class="empty">급여 데이터가 없습니다.</div>';return'<div class="list">'+DATA.salary.map(s=>'<div class="row"><div class="avatar">'+esc(s.name[0])+'</div><div class="row-main"><b>'+esc(s.name)+'</b><div>매출 '+won(s.sales)+' · '+s.paid_sessions+'회</div></div><b style="font-size:13px">'+won(s.estimated_salary)+'</b></div>').join('')+'</div>'}
function scheduleList(arr,trainerActions=false){if(!arr.length)return'<div class="empty"><b>일정이 없습니다.</b>여유로운 하루예요.</div>';return arr.map(s=>'<div class="schedule"><div class="time">'+hm(s.start_at)+'</div><div class="who"><b>'+esc(memberName(s.member_id))+'</b><div>'+esc(trainerName(s.trainer_id))+' · '+esc(s.title||'PT')+'</div></div><div class="actions">'+statusBadge(s.status)+(trainerActions&&s.status==='scheduled'?'<button class="btn sm blue" onclick="complete(\\''+s.id+'\\')">완료</button><button class="btn sm secondary" onclick="noteModal(\\''+s.id+'\\')">일지</button><button class="btn sm red" onclick="noshowModal(\\''+s.id+'\\')">노쇼</button>':'')+'</div></div>').join('')}
function renderSchedule(){const canEdit=DATA.user.role!=='member';$('main').innerHTML=headline('스케줄','예약 시 1회가 예약잠금되고, 수업완료 시 사용횟수로 확정됩니다.')+(canEdit?'<div class="card" style="margin-bottom:14px"><div class="section-title"><h2>새 PT 예약</h2><span>담당회원 기준</span></div><div class="formgrid"><div class="field"><label>회원</label><select id="scMember">'+DATA.members.map(m=>'<option value="'+m.id+'">'+esc(m.name)+' · 잔여 '+remaining(m)+'회</option>').join('')+'</select></div><div class="field"><label>일시</label><input id="scStart" type="datetime-local"></div><div class="field span2"><label>메모/수업명</label><input id="scTitle" placeholder="예: 하체 · 스쿼트 중심"></div><div class="span2"><button class="btn blue" onclick="createSchedule()">예약 등록</button></div></div></div>':'')+'<div class="card"><div class="section-title"><h2>전체 일정</h2><span>'+DATA.schedules.length+'건</span></div>'+groupSchedules(DATA.schedules)+'</div>'}function groupSchedules(arr){if(!arr.length)return'<div class="empty">등록된 일정이 없습니다.</div>';const groups={};arr.forEach(s=>{const k=day(s.start_at);(groups[k]??=[]).push(s)});return Object.entries(groups).map(([k,v])=>'<div class="schedule-day">'+k+'</div>'+scheduleList(v,DATA.user.role==='trainer')).join('')}async function createSchedule(){try{await api('create_schedule',{member_id:$('scMember').value,start_at:$('scStart').value,title:$('scTitle').value});toast('예약이 등록됐어요');await load();render()}catch(e){toast(e.message)}}async function complete(id){try{await api('complete_schedule',{id});toast('수업 완료 · 1회 사용 확정');await load();render()}catch(e){toast(e.message)}}function noshowModal(id){openModal('노쇼 처리','<p class="soft">노쇼를 PT 1회 차감할까요?</p><div class="split"><button class="btn secondary" onclick="noshow(\\''+id+'\\',false)">미차감</button><button class="btn red" onclick="noshow(\\''+id+'\\',true)">1회 차감</button></div>')}async function noshow(id,charge){try{await api('noshow_schedule',{id,charge});closeModal();toast(charge?'노쇼 · 1회 차감':'노쇼 · 미차감');await load();render()}catch(e){toast(e.message)}}function memberCancelButton(s){const h=(new Date(s.start_at)-new Date())/3600000;return h>=24?'<button class="btn secondary" style="margin-top:16px" onclick="cancelMember(\\''+s.id+'\\')">수업 취소</button>':'<div class="badge orange" style="display:inline-block;margin-top:16px">24시간 이내 · 직접취소 불가</div>'}async function cancelMember(id){if(!confirm('이 수업을 취소할까요? 예약된 1회는 자동 복구됩니다.'))return;try{await api('cancel_schedule',{id});toast('취소 완료 · 트레이너에게 알림 전송');await load();render()}catch(e){toast(e.message)}}
function renderPeople(){$('main').innerHTML=headline(DATA.user.role==='admin'?'회원 · 트레이너':'내 회원','횟수는 단순하게, 변경은 기록이 남도록 관리합니다.')+(DATA.user.role==='admin'?'<div class="grid two"><div class="card"><div class="section-title"><h2>트레이너 추가</h2><span>계정 동시 생성</span></div>'+trainerForm()+'</div><div class="card"><div class="section-title"><h2>회원 추가</h2><span>PT횟수 설정</span></div>'+memberForm()+'</div></div>':'')+'<div class="card" style="margin-top:14px"><div class="section-title"><h2>회원</h2><span>'+DATA.members.length+'명</span></div>'+memberTable()+'</div>'}function trainerForm(){return'<div class="formgrid"><div class="field"><label>이름</label><input id="trName"></div><div class="field"><label>기본급</label><input id="trBasic" type="number"></div><div class="field"><label>아이디</label><input id="trId"></div><div class="field"><label>초기 비밀번호</label><input id="trPw" type="password"></div><div class="span2"><button class="btn" onclick="addTrainer()">트레이너 추가</button></div></div>'}function memberForm(){return'<div class="formgrid"><div class="field"><label>이름</label><input id="mbName"></div><div class="field"><label>담당 트레이너</label><select id="mbTrainer">'+DATA.trainers.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div><div class="field"><label>총 PT횟수</label><input id="mbTotal" type="number" value="20"></div><div class="field"><label>아이디</label><input id="mbId"></div><div class="field"><label>초기 비밀번호</label><input id="mbPw" type="password"></div><div><button class="btn" style="margin-top:22px" onclick="addMember()">회원 추가</button></div></div>'}async function addTrainer(){try{await api('add_trainer',{name:$('trName').value,basic_salary:$('trBasic').value,username:$('trId').value,password:$('trPw').value});toast('트레이너와 계정이 생성됐어요');await load();render()}catch(e){toast(e.message)}}async function addMember(){try{await api('add_member',{name:$('mbName').value,trainer_id:$('mbTrainer').value,total_sessions:$('mbTotal').value,username:$('mbId').value,password:$('mbPw').value});toast('회원과 계정이 생성됐어요');await load();render()}catch(e){toast(e.message)}}function memberTable(){if(!DATA.members.length)return'<div class="empty">회원이 없습니다.</div>';return'<div class="tablewrap"><table><thead><tr><th>회원</th><th>트레이너</th><th>총</th><th>사용</th><th>예약</th><th>남음</th><th>관리</th></tr></thead><tbody>'+DATA.members.map(m=>'<tr><td><b>'+esc(m.name)+'</b></td><td>'+esc(trainerName(m.trainer_id))+'</td><td>'+m.total_sessions+'</td><td>'+m.used_sessions+'</td><td>'+m.locked_sessions+'</td><td><span class="badge '+(remaining(m)<=3?'orange':'green')+'">'+remaining(m)+'회</span></td><td>'+(DATA.user.role==='trainer'?'<button class="btn sm secondary" onclick="changeReq(\\''+m.id+'\\',\\'name\\')">이름수정</button> <button class="btn sm secondary" onclick="changeReq(\\''+m.id+'\\',\\'total_sessions\\')">횟수수정</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'}
function changeReq(id,field){const m=DATA.members.find(x=>x.id===id);openModal('수정 요청','<div class="field"><label>현재값</label><input value="'+esc(m[field])+'" disabled></div><div class="field" style="margin-top:10px"><label>변경값</label><input id="crValue"></div><div class="field" style="margin-top:10px"><label>사유</label><input id="crReason" placeholder="선택사항"></div><button class="btn blue" style="margin-top:14px;width:100%" onclick="submitChange(\\''+id+'\\',\\''+field+'\\')">관리자에게 요청</button>')}async function submitChange(id,field){try{await api('request_change',{member_id:id,field_name:field,new_value:$('crValue').value,reason:$('crReason').value});closeModal();toast('수정요청을 보냈어요');await load();render()}catch(e){toast(e.message)}}
function renderSalary(){const isAdmin=DATA.user.role==='admin';$('main').innerHTML=headline(isAdmin?'급여 관리':'내 급여','같은 계산식을 센터와 트레이너가 함께 확인합니다.')+'<div class="grid metrics">'+DATA.salary.map(s=>'<div class="card metric '+(!isAdmin?'accent':'')+'"><label>'+esc(s.name)+' 예상급여</label><strong style="font-size:24px">'+won(s.estimated_salary)+'</strong><small>기본 '+won(s.basic_salary)+' · '+s.paid_sessions+'회 × '+won(s.per_session_fee)+'</small></div>').join('')+'</div>'+(isAdmin?'<div class="grid two"><div class="card"><div class="section-title"><h2>트레이너별 월 설정</h2><span>기본급 · 매출 · 인센티브</span></div>'+salaryAdminRows()+'</div><div class="card"><div class="section-title"><h2>매출구간별 회당 수업료</h2><span>관리자 설정</span></div>'+salaryRules()+'</div></div>':salaryDetail(DATA.salary[0]))}function salaryDetail(s){if(!s)return'';return'<div class="card"><div class="section-title"><h2>산출 근거</h2><span>'+s.month.slice(0,7)+'</span></div><div class="list"><div class="row"><div class="row-main"><b>기본급</b></div><b>'+won(s.basic_salary)+'</b></div><div class="row"><div class="row-main"><b>급여 인정 수업</b><div>'+s.paid_sessions+'회 × '+won(s.per_session_fee)+'</div></div><b>'+won(s.paid_sessions*s.per_session_fee)+'</b></div><div class="row"><div class="row-main"><b>인센티브</b><div>정액 + 매출비율</div></div><b>'+won(s.incentive_total)+'</b></div></div></div>'}function salaryAdminRows(){return'<div class="list">'+DATA.salary.map(s=>'<div class="row"><div class="row-main"><b>'+esc(s.name)+'</b><div>매출 '+won(s.sales)+' · 인정 '+s.paid_sessions+'회 · 회당 '+won(s.per_session_fee)+'</div></div><button class="btn sm secondary" onclick="salaryModal(\\''+s.trainer_id+'\\')">설정</button></div>').join('')+'</div>'}function salaryModal(id){const s=DATA.salary.find(x=>x.trainer_id===id);openModal(s.name+' 급여 설정','<div class="formgrid"><div class="field"><label>기본급</label><input id="saBasic" type="number" value="'+s.basic_salary+'"></div><div class="field"><label>이번달 매출</label><input id="saSales" type="number" value="'+s.sales+'"></div><div class="field"><label>정액 인센티브</label><input id="saAmt" type="number" value="'+s.incentive_amount+'"></div><div class="field"><label>매출 인센티브 %</label><input id="saPct" type="number" step="0.1" value="'+s.incentive_percent+'"></div></div><button class="btn blue" style="width:100%;margin-top:14px" onclick="saveSalary(\\''+id+'\\')">적용</button>')}async function saveSalary(id){try{await api('set_salary',{trainer_id:id,month:new Date().toISOString().slice(0,7)+'-01',basic_salary:$('saBasic').value,sales:$('saSales').value,incentive_amount:$('saAmt').value,incentive_percent:$('saPct').value});closeModal();toast('급여 설정이 반영됐어요');await load();render()}catch(e){toast(e.message)}}function salaryRules(){return'<div class="list">'+DATA.salary_rules.map(r=>'<div class="row"><div class="row-main"><b>'+Number(r.min_sales).toLocaleString()+' ~ '+(r.max_sales==null?'이상':Number(r.max_sales).toLocaleString())+'</b><div>매출구간</div></div><b>'+won(r.per_session_fee)+'/회</b></div>').join('')+'</div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="rulesModal()">급여표 수정</button>'}function rulesModal(){const txt=DATA.salary_rules.map(r=>r.min_sales+','+(r.max_sales??'')+','+r.per_session_fee).join('\\n');openModal('급여구간 수정','<p class="soft">한 줄에 최소매출, 최대매출, 회당수업료 순서로 입력하세요.</p><div class="field"><textarea id="rulesText" rows="8">'+txt+'</textarea></div><button class="btn blue" style="width:100%;margin-top:12px" onclick="saveRules()">적용</button>')}async function saveRules(){try{const rules=$('rulesText').value.split('\\n').filter(Boolean).map(l=>{const[a,b,c]=l.split(',');return{min_sales:a,max_sales:b===''?null:b,per_session_fee:c}});await api('set_salary_rules',{rules});closeModal();toast('급여표가 변경됐어요');await load();render()}catch(e){toast(e.message)}}
function renderApproval(){$('main').innerHTML=headline('수정 승인','트레이너 수정은 관리자 승인 후 반영되고 기록이 남습니다.')+'<div class="card"><div class="section-title"><h2>수정요청</h2><span>'+DATA.change_requests.filter(x=>x.status==='pending').length+'건 대기</span></div>'+approvalList()+'</div>'}function approvalList(){if(!DATA.change_requests.length)return'<div class="empty">수정요청이 없습니다.</div>';return'<div class="list">'+DATA.change_requests.map(c=>'<div class="row"><div class="row-main"><b>'+esc(memberName(c.target_id))+' · '+esc(c.field_name)+'</b><div>'+esc(c.old_value)+' → '+esc(c.new_value)+' · '+new Date(c.created_at).toLocaleString('ko-KR')+'</div></div><span class="badge '+(c.status==='approved'?'green':c.status==='rejected'?'red':'orange')+'">'+c.status+'</span>'+(c.status==='pending'?'<button class="btn sm secondary" onclick="reviewChange(\\''+c.id+'\\',false)">반려</button><button class="btn sm blue" onclick="reviewChange(\\''+c.id+'\\',true)">승인</button>':'')+'</div>').join('')+'</div>'}async function reviewChange(id,approve){try{await api('review_change',{id,approve});toast(approve?'승인 완료':'반려 완료');await load();render()}catch(e){toast(e.message)}}
function renderNotes(){const eligible=DATA.schedules.filter(s=>s.status==='completed'||s.status==='scheduled').slice().reverse();$('main').innerHTML=headline(DATA.user.role==='member'?'수업내용':'수업일지','수업별 운동내용을 회원과 공유합니다.')+'<div class="card"><div class="section-title"><h2>수업 기록</h2><span>'+DATA.notes.length+'개 공유</span></div>'+eligible.map(s=>{const n=DATA.notes.find(x=>x.schedule_id===s.id);return'<div class="notice"><b>'+day(s.start_at)+' · '+esc(memberName(s.member_id))+'</b><p>'+(n?esc(n.content):'아직 작성된 수업일지가 없습니다.')+'</p>'+(DATA.user.role!=='member'?'<button class="btn sm secondary" style="margin-top:8px" onclick="noteModal(\\''+s.id+'\\')">'+(n?'수정':'작성')+'</button>':'')+'</div>'}).join('')+'</div>'}function noteModal(id){const n=DATA.notes.find(x=>x.schedule_id===id);openModal('수업일지','<div class="field"><label>회원에게 공유할 운동내용</label><textarea id="noteText" rows="8" placeholder="운동 / 중량 / 횟수 / 다음 수업 포인트">'+esc(n?.content||'')+'</textarea></div><button class="btn blue" style="width:100%;margin-top:12px" onclick="saveNote(\\''+id+'\\')">저장하고 공유</button>')}async function saveNote(id){try{await api('save_note',{schedule_id:id,content:$('noteText').value});closeModal();toast('회원에게 공유됐어요');await load();render()}catch(e){toast(e.message)}}
function renderQna(){const schedules=DATA.schedules.slice().reverse();$('main').innerHTML=headline('수업 Q&A','궁금한 내용은 해당 수업에 이어서 남겨보세요.')+'<div class="card">'+schedules.map(s=>{const qs=DATA.qna.filter(q=>q.schedule_id===s.id);return'<div class="notice"><b>'+day(s.start_at)+' · '+esc(s.title||'PT')+'</b>'+qs.map(q=>'<p><b>Q.</b> '+esc(q.question)+(q.answer?'<br><b>A.</b> '+esc(q.answer):'<br><span class="badge orange">답변 대기</span>')+'</p>').join('')+'<button class="btn sm secondary" style="margin-top:8px" onclick="askModal(\\''+s.id+'\\')">질문 추가</button></div>'}).join('')+'</div>'}function askModal(id){openModal('수업 Q&A','<div class="field"><label>트레이너에게 질문</label><textarea id="qText" rows="5" placeholder="예: 스쿼트할 때 무릎 방향을 다시 알려주세요."></textarea></div><button class="btn blue" style="width:100%;margin-top:12px" onclick="sendQuestion(\\''+id+'\\')">질문 보내기</button>')}async function sendQuestion(id){try{await api('ask_question',{schedule_id:id,question:$('qText').value});closeModal();toast('질문을 보냈어요');await load();render()}catch(e){toast(e.message)}}
function renderMemberMy(){const m=DATA.members[0];$('main').innerHTML=headline('내 정보','필요한 정보만 간단하게 보여줍니다.')+'<div class="grid two"><div class="card"><div class="kicker">PT SUMMARY</div><div class="big">'+remaining(m)+'회</div><div class="list"><div class="row"><div class="row-main"><b>총 등록</b></div><b>'+m.total_sessions+'회</b></div><div class="row"><div class="row-main"><b>사용 완료</b></div><b>'+m.used_sessions+'회</b></div><div class="row"><div class="row-main"><b>예약 잠금</b></div><b>'+m.locked_sessions+'회</b></div></div></div><div class="card"><div class="section-title"><h2>담당 트레이너</h2></div><div class="row"><div class="avatar">'+esc(trainerName(m.trainer_id)[0])+'</div><div class="row-main"><b>'+esc(trainerName(m.trainer_id))+'</b><div>THE KING GYM Trainer</div></div></div></div></div>'}
function openNotifications(){openModal('알림','<div class="list">'+(DATA.notifications.length?DATA.notifications.map(n=>'<div class="notice '+(!n.read_at?'unread':'')+'" onclick="markN(\\''+n.id+'\\')"><b>'+esc(n.title)+'</b><p>'+esc(n.body||'')+' · '+new Date(n.created_at).toLocaleString('ko-KR')+'</p></div>').join(''):'<div class="empty">새 알림이 없습니다.</div>')+'</div>')}async function markN(id){try{await api('mark_notification',{id});await load();updateNotify();openNotifications()}catch(e){}}function openProfile(){openModal('계정','<div class="row"><div class="avatar">'+esc(DATA.user.display_name[0])+'</div><div class="row-main"><b>'+esc(DATA.user.display_name)+'</b><div>'+roleName(DATA.user.role)+'</div></div></div><div class="field" style="margin-top:15px"><label>새 비밀번호</label><input id="newPw" type="password" placeholder="6자 이상"></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="changePw()">비밀번호 변경</button><button class="btn red" style="width:100%;margin-top:10px" onclick="logout()">로그아웃</button>')}async function changePw(){try{await api('change_password',{password:$('newPw').value});closeModal();toast('비밀번호가 변경됐어요')}catch(e){toast(e.message)}}async function logout(){try{await api('logout')}catch{}logoutLocal()}function logoutLocal(){localStorage.removeItem('tk_session');TOKEN='';location.reload()}boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
