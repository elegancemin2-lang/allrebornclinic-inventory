<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CBT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--p:#fff;--t:#0f172a;--m:#64748b;--l:#e5eaf1;--b:#2563eb;--bd:#1d4ed8;--r:18px;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}
.top{position:sticky;top:0;z-index:20;height:62px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:800;letter-spacing:-.03em}.brand small{display:block;font-size:11px;color:var(--m);font-weight:600;margin-top:2px}.actions{display:flex;gap:8px;align-items:center}
.wrap{max-width:1120px;margin:auto;padding:26px 20px 90px}.card{background:var(--p);border:1px solid var(--l);border-radius:22px;padding:20px;box-shadow:0 5px 20px rgba(15,23,42,.04)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:#eef2f7;color:#334155}.btn.pri{background:var(--b);color:#fff}.btn.pri:hover{background:var(--bd)}.btn.danger{background:#fef2f2;color:#dc2626}.btn.ghost{background:#fff;border:1px solid var(--l)}.btn:disabled{opacity:.55}.full{width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--l);border-radius:28px;padding:30px;box-shadow:0 18px 60px rgba(15,23,42,.08)}.eyebrow{font-size:12px;font-weight:800;color:var(--b);letter-spacing:.08em}.loginbox h1{font-size:30px;margin:9px 0 7px;letter-spacing:-.05em}.sub{color:var(--m);line-height:1.6}
.field{display:flex;flex-direction:column;gap:7px;margin-top:15px}.field label{font-size:12px;font-weight:800;color:#475569}.inp,.sel,.ta{width:100%;border:1px solid #dbe2ea;background:#fff;border-radius:13px;padding:12px 13px;outline:none}.ta{min-height:100px;resize:vertical}.inp:focus,.sel:focus,.ta:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
.title{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:18px}.title h2{margin:0;font-size:27px;letter-spacing:-.04em}.title p{margin:5px 0 0;color:var(--m)}.stat .k{font-size:12px;color:var(--m);font-weight:700}.stat .v{font-size:28px;font-weight:900;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{border:1px solid var(--l);border-radius:16px;padding:13px}.step b{font-size:13px}.step span{display:block;color:var(--m);font-size:12px;margin-top:4px;line-height:1.45}
.subject{border:1px solid var(--l);background:#fff;border-radius:19px;padding:18px;text-align:left}.subject:hover{border-color:#bfdbfe;box-shadow:0 8px 24px rgba(37,99,235,.07)}.subject b{font-size:17px}.muted{color:var(--m);font-size:12px;margin-top:5px}.empty{padding:28px;text-align:center;border:1px dashed #cbd5e1;border-radius:17px;color:var(--m)}
.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:16px}.tbl{width:100%;border-collapse:collapse;min-width:720px;background:#fff}.tbl th,.tbl td{padding:12px 13px;border-bottom:1px solid var(--l);text-align:left;font-size:13px}.tbl th{background:#f8fafc;color:#475569;font-size:12px}
.rank{display:grid;grid-template-columns:42px 1fr 90px 90px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.rank strong{font-weight:900}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:50;display:grid;place-items:center;padding:18px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:21px;box-shadow:0 30px 90px rgba(15,23,42,.24)}.modal h3{margin:0 0 8px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.examgrid{display:grid;grid-template-columns:200px 1fr;gap:16px}.qnav{position:sticky;top:78px;align-self:start}.qnums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.qnum{border:1px solid var(--l);background:#fff;border-radius:9px;padding:7px 0;font-size:12px}.qnum.on{background:#0f172a;color:#fff}.qnum.done{background:#eff6ff;color:#1d4ed8;border-color:#93c5fd}.qcard{background:#fff;border:1px solid var(--l);border-radius:22px;padding:22px}.qtxt{font-size:19px;font-weight:700;line-height:1.65;margin:16px 0}.choice{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--l);border-radius:15px;padding:13px;margin-top:9px;background:#fff}.choice.on{background:#eff6ff;border-color:#60a5fa}.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#f1f5f9;font-weight:800;flex:0 0 auto}.exacts{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.score{font-size:54px;font-weight:900;letter-spacing:-.05em}.toast{position:fixed;right:16px;bottom:16px;z-index:99;background:#0f172a;color:#fff;padding:11px 14px;border-radius:12px;font-size:13px}.nav{display:none}
@media(max-width:880px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.examgrid{grid-template-columns:1fr}.qnav{position:static}}
@media(max-width:640px){.top{height:58px;padding:0 13px}.wrap{padding:17px 13px 88px}.g4,.g3,.g2{grid-template-columns:1fr}.title{align-items:flex-start;flex-direction:column}.title h2{font-size:23px}.loginbox{padding:25px 19px}.card{border-radius:18px;padding:16px}.formrow{grid-template-columns:1fr}.qcard{padding:17px 14px}.qtxt{font-size:18px}.qnums{grid-template-columns:repeat(8,1fr)}.rank{grid-template-columns:36px 1fr 70px}.rank .acc{display:none}.nav{display:grid;position:fixed;left:0;right:0;bottom:0;height:62px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--l);grid-template-columns:repeat(4,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;font-size:11px;color:#64748b;font-weight:800}.nav button.on{color:#0f172a}.actions .ghost{display:none}.exacts{position:sticky;bottom:70px;background:rgba(245,247,251,.94);padding:9px 0;backdrop-filter:blur(10px)}}
</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const host=location.hostname.toLowerCase(),isG=host.includes('gayoung')||new URLSearchParams(location.search).get('app')==='gayoung';
const C=isG?{code:'GAYOUNG',name:'가영쌤 CBT',teacher:'가영쌤',admin:'rkdud'}:{code:'SANGEUN',name:'상은쌤 CBT',teacher:'상은쌤',admin:'tkddms'};
document.title=C.name;
const URL='https://kcwahwlhzlgpzuxjqbqu.supabase.co',KEY='sb_publishable_s1pEA3miO6gMfAuquy033Q_kqitiP6C';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const S={session:null,p:null,ws:null,view:'home',subjects:[],students:[],lb:[],subject:null,exams:[],exam:null,qs:[],attempt:null,answers:{},qi:0,result:null};
const A=document.getElementById('app');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const email=u=>`${C.code.toLowerCase()}__${String(u).trim().toLowerCase()}@cbt.local`;
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function role(){return S.p?.role}
async function admin(body){const {data,error}=await sb.functions.invoke('cbt-admin',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data}
async function me(){
 const uid=S.session?.user?.id;if(!uid)return false;
 let {data:p}=await sb.from('cbt_profiles').select('*').eq('user_id',uid).maybeSingle();
 if(!p||!p.is_active)return false;
 let {data:w}=await sb.from('cbt_workspaces').select('*').eq('id',p.workspace_id).maybeSingle();
 if(!w||w.code!==C.code)return false;S.p=p;S.ws=w;return true;
}
async function base(){
 let [{data:s},{data:l}]=await Promise.all([sb.from('cbt_subjects').select('*').order('sort_order').order('name'),sb.from('cbt_leaderboard').select('*').order('solved_count',{ascending:false}).limit(30)]);
 S.subjects=s||[];S.lb=l||[];
 if(role()==='teacher'){let {data:u}=await sb.from('cbt_profiles').select('*').eq('role','student').order('display_name');S.students=u||[]}
}
async function boot(){let {data}=await sb.auth.getSession();S.session=data.session;if(!S.session)return login();if(!(await me())){await sb.auth.signOut();return login('사용 권한이 없는 계정입니다.')}await base();render()}
function login(msg=''){
 A.innerHTML=`<div class="login"><div class="loginbox"><div class="eyebrow">${C.code} · CBT</div><h1>${C.name}</h1><div class="sub">휴대폰과 PC에서 같은 계정으로 사용할 수 있습니다.</div>${msg?'<div class="card" style="margin-top:14px;color:#b91c1c;background:#fef2f2">'+e(msg)+'</div>':''}<form id="lf"><div class="field"><label>아이디</label><input class="inp" name="u" autocomplete="username" required></div><div class="field"><label>비밀번호</label><input class="inp" type="password" name="p" autocomplete="current-password" required></div><button class="btn pri full" style="margin-top:20px">로그인</button></form><div class="muted" style="margin-top:12px">로그인이 안 되면 ${C.teacher}에게 비밀번호 초기화를 요청하세요.</div></div></div>`;
 document.getElementById('lf').onsubmit=async x=>{x.preventDefault();let f=new FormData(x.currentTarget),u=String(f.get('u')).trim().toLowerCase(),b=x.currentTarget.querySelector('button');b.disabled=true;b.textContent='로그인 중…';let {data,error}=await sb.auth.signInWithPassword({email:email(u),password:String(f.get('p'))});if(error)return login('아이디 또는 비밀번호를 확인해 주세요.');S.session=data.session;
 if(!(await me())&&u===C.admin){try{await admin({action:'claim_teacher',workspace_code:C.code});await sb.auth.refreshSession();S.session=(await sb.auth.getSession()).data.session;if(!(await me()))throw 0}catch{await sb.auth.signOut();return login('관리자 권한 연결에 실패했습니다. 다시 시도해 주세요.')}}else if(!S.p){await sb.auth.signOut();return login('사용 권한이 없는 계정입니다.')}
 await base();S.view='home';render()}
}
function shell(body){let t=role()==='teacher';return `<header class="top"><div class="brand">${C.name}<small>${t?'관리자':'학생'} · ${e(S.p.display_name)}</small></div><div class="actions"><button class="btn ghost" data-v="rank">학습현황</button>${t?'<button class="btn" id="settings">설정</button>':''}<button class="btn" id="logout">로그아웃</button></div></header><main class="wrap">${body}</main><nav class="nav"><button data-v="home" class="${S.view==='home'?'on':''}">홈</button><button data-v="rank" class="${S.view==='rank'?'on':''}">현황</button><button data-v="${t?'students':'home'}" class="${S.view==='students'?'on':''}">${t?'학생':'학습'}</button><button data-v="${t?'content':'home'}" class="${S.view==='content'?'on':''}">${t?'문제':'내정보'}</button></nav>`}
function teacherHome(){let n=S.students.filter(x=>x.is_active).length,total=S.lb.reduce((a,x)=>a+Number(x.solved_count||0),0);return `<div class="title"><div><h2>관리 대시보드</h2><p>아래 순서대로만 하면 됩니다.</p></div></div><div class="steps"><div class="step"><b>1. 종목 만들기</b><span>학생이 풀 과목·자격증</span></div><div class="step"><b>2. 시험·문제 넣기</b><span>직접 입력 또는 엑셀</span></div><div class="step"><b>3. 학생 등록</b><span>아이디와 초기 비밀번호</span></div><div class="step"><b>4. 접근권한 켜기</b><span>학생별 허용 종목 선택</span></div></div><div class="grid g4" style="margin-top:15px"><div class="card stat"><div class="k">학생</div><div class="v">${n}</div></div><div class="card stat"><div class="k">종목</div><div class="v">${S.subjects.length}</div></div><div class="card stat"><div class="k">이번 주 학습자</div><div class="v">${S.lb.length}</div></div><div class="card stat"><div class="k">이번 주 풀이</div><div class="v">${total}</div></div></div><div class="grid g2" style="margin-top:15px"><div class="card"><b>빠른 시작</b><div class="toolbar" style="margin-top:12px"><button class="btn pri" data-v="content">종목·문제 관리</button><button class="btn" data-v="students">학생·권한 관리</button></div></div><div class="card"><b>이번 주 상위 학습</b><div style="margin-top:9px">${ranks(5)}</div></div></div>`}
function ranks(limit=99){return S.lb.length?S.lb.slice(0,limit).map((x,i)=>`<div class="rank"><strong>${i+1}</strong><div><b>${e(x.display_name)}</b><div class="muted">응시 ${x.attempt_count||0}회</div></div><div>${x.solved_count||0}문제</div><div class="acc">${Number(x.accuracy||0).toFixed(1)}%</div></div>`).join(''):'<div class="empty">아직 학습 기록이 없습니다.</div>'}
function students(){return `<div class="title"><div><h2>학생 관리</h2><p>학생을 만들고 종목 권한만 켜주면 됩니다.</p></div><button class="btn pri" id="addStu">학생 추가</button></div><div class="card">${S.students.length?`<div class="tablewrap"><table class="tbl"><thead><tr><th>이름</th><th>아이디</th><th>반</th><th>종목권한</th><th>관리</th></tr></thead><tbody>${S.students.map(s=>`<tr><td><b>${e(s.display_name)}</b></td><td>${e(s.username)}</td><td>${e(s.class_name||'-')}</td><td><button class="btn" data-access="${s.user_id}">권한 설정</button></td><td><div class="toolbar"><button class="btn" data-reset="${s.user_id}">비밀번호 초기화</button><button class="btn danger" data-del="${s.user_id}">삭제</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">등록된 학생이 없습니다.</div>'}</div>`}
function content(){return `<div class="title"><div><h2>종목 · 시험 · 문제</h2><p>종목 → 시험 → 문제 순서로 등록하세요.</p></div><button class="btn pri" id="addSub">종목 추가</button></div><div class="grid g3">${S.subjects.map(s=>`<button class="subject" data-sub="${s.id}"><b>${e(s.name)}</b><div class="muted">${e(s.description||'설명 없음')} · 시험 관리</div></button>`).join('')||'<div class="empty">종목이 없습니다.</div>'}</div>`}
function studentHome(){return `<div class="title"><div><h2>${e(S.p.display_name)}님</h2><p>허용된 종목만 표시됩니다.</p></div></div><div class="grid g3">${S.subjects.map(s=>`<button class="subject" data-ss="${s.id}"><b>${e(s.name)}</b><div class="muted">시험 선택하기</div></button>`).join('')||'<div class="empty">현재 학습 가능한 종목이 없습니다.</div>'}</div>`}
function subjectView(){return `<div class="title"><div><h2>${e(S.subject?.name)}</h2><p>풀 시험을 선택하세요.</p></div><button class="btn" data-v="home">돌아가기</button></div><div class="grid g2">${S.exams.map(x=>`<div class="card"><b>${e(x.title)}</b><div class="muted">${x.duration_minutes?x.duration_minutes+'분':''}</div><button class="btn pri full" style="margin-top:12px" data-start="${x.id}">문제 풀기</button></div>`).join('')||'<div class="empty">공개된 시험이 없습니다.</div>'}</div>`}
function examView(){let q=S.qs[S.qi],sel=S.answers[q.id];return `<div class="title"><div><h2>${e(S.exam.title)}</h2><p>${S.qi+1} / ${S.qs.length}</p></div><button class="btn danger" id="submitTop">제출</button></div><div class="examgrid"><div class="card qnav"><div class="qnums">${S.qs.map((x,i)=>`<button class="qnum ${i===S.qi?'on':''} ${S.answers[x.id]?'done':''}" data-qi="${i}">${i+1}</button>`).join('')}</div></div><div class="qcard"><div class="muted">${q.question_no}번</div><div class="qtxt">${e(q.question_text)}</div>${[1,2,3,4,5].filter(n=>q['choice_'+n]).map(n=>`<button class="choice ${sel===n?'on':''}" data-ch="${n}" style="width:100%;text-align:left"><span class="num">${n}</span><span>${e(q['choice_'+n])}</span></button>`).join('')}<div class="exacts"><button class="btn" id="prev" ${S.qi===0?'disabled':''}>이전</button><button class="btn pri" id="next">${S.qi===S.qs.length-1?'제출':'다음'}</button></div></div></div>`}
function resultView(){let r=S.result;return `<div class="card"><div class="muted">채점 결과</div><div class="score">${Number(r.score||0).toFixed(0)}점</div><h3>${r.correct_count} / ${r.total_count} 정답</h3><button class="btn pri" data-v="home">홈으로</button></div>`}
function render(){let body=S.view==='rank'?'<div class="title"><div><h2>학습 현황</h2><p>풀이량과 정답률을 함께 봅니다.</p></div></div><div class="card">'+ranks()+'</div>':role()==='teacher'?(S.view==='students'?students():S.view==='content'?content():teacherHome()):(S.view==='subject'?subjectView():S.view==='exam'?examView():S.view==='result'?resultView():studentHome());A.innerHTML=shell(body);bind()}
function modal(h){let bg=document.createElement('div');bg.className='modalbg';bg.innerHTML='<div class="modal">'+h+'<div style="text-align:right;margin-top:14px"><button class="btn" data-close>닫기</button></div></div>';document.body.appendChild(bg);bg.querySelector('[data-close]').onclick=()=>bg.remove();bg.onclick=x=>{if(x.target===bg)bg.remove()};return bg}
function bind(){document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{S.view=b.dataset.v;if(S.view==='home')await base();render()});document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();S.p=null;S.session=null;login()};let st=document.getElementById('settings');if(st)st.onclick=settings;
 if(role()==='teacher'){document.getElementById('addStu')&&(document.getElementById('addStu').onclick=addStudent);document.getElementById('addSub')&&(document.getElementById('addSub').onclick=addSubject);document.querySelectorAll('[data-access]').forEach(b=>b.onclick=()=>access(b.dataset.access));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{let p=prompt('새 비밀번호 (6자 이상)','123456');if(!p)return;try{await admin({action:'reset_password',user_id:b.dataset.reset,password:p});toast('변경했습니다.')}catch(x){toast(x.message)}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('학생 계정과 기록을 삭제할까요?')){await admin({action:'delete_student',user_id:b.dataset.del});await base();render()}});document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>manageSubject(b.dataset.sub))}
 else{document.querySelectorAll('[data-ss]').forEach(b=>b.onclick=()=>openSubject(b.dataset.ss));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startExam(b.dataset.start));document.querySelectorAll('[data-qi]').forEach(b=>b.onclick=()=>{S.qi=Number(b.dataset.qi);render()});document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>saveAnswer(Number(b.dataset.ch)));let p=document.getElementById('prev');if(p)p.onclick=()=>{if(S.qi){S.qi--;render()}};let n=document.getElementById('next');if(n)n.onclick=()=>S.qi===S.qs.length-1?submit():((S.qi++,render()));let z=document.getElementById('submitTop');if(z)z.onclick=submit}}
function settings(){let m=modal(`<h3>관리자 계정 설정</h3><form id="setf"><div class="field"><label>로그인 아이디</label><input class="inp" name="u" value="${e(S.p.username)}" required></div><div class="field"><label>새 비밀번호</label><input class="inp" type="password" name="p" placeholder="변경하지 않으면 비워두기"></div><button class="btn pri full" style="margin-top:15px">저장</button></form>`);m.querySelector('#setf').onsubmit=async x=>{x.preventDefault();let f=new FormData(x.currentTarget);try{await admin({action:'change_teacher_credentials',username:String(f.get('u')).trim(),password:String(f.get('p')||'')});toast('저장했습니다. 다시 로그인해 주세요.');m.remove();await sb.auth.signOut();login()}catch(z){toast(z.message)}}}
function addStudent(){let m=modal(`<h3>학생 추가</h3><form id="sf"><div class="field"><label>이름</label><input class="inp" name="n" required></div><div class="field"><label>아이디</label><input class="inp" name="u" required></div><div class="field"><label>반/학급</label><input class="inp" name="c"></div><div class="field"><label>초기 비밀번호</label><input class="inp" name="p" value="123456" required></div><button class="btn pri full" style="margin-top:15px">학생 만들기</button></form>`);m.querySelector('#sf').onsubmit=async x=>{x.preventDefault();let f=new FormData(x.currentTarget);try{await admin({action:'create_student',display_name:f.get('n'),username:f.get('u'),class_name:f.get('c'),password:f.get('p')});toast('학생을 추가했습니다.');m.remove();await base();render()}catch(z){toast(z.message)}}}
function addSubject(){let m=modal(`<h3>종목 추가</h3><form id="subf"><div class="field"><label>종목명</label><input class="inp" name="n" required placeholder="예: 전기기능사"></div><div class="field"><label>설명</label><input class="inp" name="d"></div><button class="btn pri full" style="margin-top:15px">만들기</button></form>`);m.querySelector('#subf').onsubmit=async x=>{x.preventDefault();let f=new FormData(x.currentTarget),{error}=await sb.from('cbt_subjects').insert({workspace_id:S.ws.id,name:f.get('n'),description:f.get('d')});if(error)return toast(error.message);m.remove();await base();render()}}
async function access(uid){let {data:a}=await sb.from('cbt_subject_access').select('*').eq('user_id',uid),set=new Set((a||[]).filter(x=>x.can_access).map(x=>x.subject_id));let m=modal(`<h3>종목 접근권한</h3>${S.subjects.map(s=>`<label class="choice"><input type="checkbox" data-as="${s.id}" ${set.has(s.id)?'checked':''}><span>${e(s.name)}</span></label>`).join('')}<button class="btn pri full" id="saveA" style="margin-top:15px">저장</button>`);m.querySelector('#saveA').onclick=async()=>{for(let c of m.querySelectorAll('[data-as]'))await sb.from('cbt_subject_access').upsert({workspace_id:S.ws.id,subject_id:c.dataset.as,user_id:uid,can_access:c.checked},{onConflict:'subject_id,user_id'});toast('권한을 저장했습니다.');m.remove()}}
async function manageSubject(id){S.subject=S.subjects.find(x=>x.id===id);let {data}=await sb.from('cbt_exams').select('*').eq('subject_id',id).order('year',{ascending:false});S.exams=data||[];let m=modal(`<h3>${e(S.subject.name)}</h3><button class="btn pri" id="newExam">시험 추가</button><div style="margin-top:12px">${S.exams.map(x=>`<div class="choice"><div style="flex:1"><b>${e(x.title)}</b><div class="muted">${x.is_published?'학생 공개 중':'비공개'}</div></div><button class="btn" data-qm="${x.id}">문제</button><button class="btn" data-pub="${x.id}" data-vv="${x.is_published?'0':'1'}">${x.is_published?'비공개':'공개'}</button></div>`).join('')||'<div class="empty">시험이 없습니다.</div>'}</div>`);m.querySelector('#newExam').onclick=()=>newExam(m);m.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>questions(b.dataset.qm,m));m.querySelectorAll('[data-pub]').forEach(b=>b.onclick=async()=>{await sb.from('cbt_exams').update({is_published:b.dataset.vv==='1'}).eq('id',b.dataset.pub);m.remove();manageSubject(id)})}
function newExam(parent){let m=modal(`<h3>시험 추가</h3><form id="ef"><div class="field"><label>시험 제목</label><input class="inp" name="t" required placeholder="예: 2025년 1회"></div><div class="formrow"><div class="field"><label>연도</label><input class="inp" name="y" type="number"></div><div class="field"><label>회차</label><input class="inp" name="s"></div></div><div class="field"><label>시험시간(분)</label><input class="inp" name="d" type="number" value="60"></div><button class="btn pri full" style="margin-top:15px">만들기</button></form>`);m.querySelector('#ef').onsubmit=async x=>{x.preventDefault();let f=new FormData(x.currentTarget),{error}=await sb.from('cbt_exams').insert({workspace_id:S.ws.id,subject_id:S.subject.id,title:f.get('t'),year:f.get('y')?Number(f.get('y')):null,session:f.get('s')||null,duration_minutes:Number(f.get('d')||0)});if(error)return toast(error.message);m.remove();parent.remove();manageSubject(S.subject.id)}}
async function questions(examId,parent){S.exam=S.exams.find(x=>x.id===examId);let r;try{r=await admin({action:'list_questions',exam_id:examId})}catch(x){return toast(x.message)}let qs=r.questions||[],m=modal(`<h3>${e(S.exam.title)} · 문제</h3><div class="toolbar"><button class="btn pri" id="addQ">문제 추가</button><button class="btn" id="tpl">엑셀 양식</button><label class="btn">엑셀 업로드<input type="file" id="xlsx" accept=".xlsx,.xls" style="display:none"></label></div><div style="margin-top:12px">${qs.map(q=>`<div class="choice"><div style="flex:1"><b>${q.question_no}번</b> ${e(q.question_text).slice(0,55)}</div><button class="btn" data-edit="${q.id}">수정</button><button class="btn danger" data-dq="${q.id}">삭제</button></div>`).join('')||'<div class="empty">문제가 없습니다.</div>'}</div>`);m.querySelector('#addQ').onclick=()=>qform(examId,null,m);m.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>qform(examId,qs.find(q=>q.id===b.dataset.edit),m));m.querySelectorAll('[data-dq]').forEach(b=>b.onclick=async()=>{if(confirm('삭제할까요?')){await admin({action:'delete_question',question_id:b.dataset.dq});m.remove();questions(examId,parent)}});m.querySelector('#tpl').onclick=()=>{let ws=XLSX.utils.json_to_sheet([{question_no:1,question_text:'문제',choice_1:'보기1',choice_2:'보기2',choice_3:'보기3',choice_4:'보기4',choice_5:'',correct_choice:1,explanation:'해설'}]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'문제');XLSX.writeFile(wb,C.name+'_문제등록양식.xlsx')};m.querySelector('#xlsx').onchange=async x=>{let f=x.target.files[0];if(!f)return;let wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let z=await admin({action:'bulk_questions',exam_id:examId,questions:rows});toast(z.imported+'문제를 등록했습니다.');m.remove();questions(examId,parent)}}
function qform(examId,q,parent){let m=modal(`<h3>${q?'문제 수정':'문제 추가'}</h3><form id="qf"><div class="formrow"><div class="field"><label>문제번호</label><input class="inp" name="n" type="number" value="${q?.question_no||''}" required></div><div class="field"><label>정답</label><select class="sel" name="a">${[1,2,3,4,5].map(n=>'<option '+(q?.correct_choice===n?'selected':'')+'>'+n+'</option>').join('')}</select></div></div><div class="field"><label>문제</label><textarea class="ta" name="t" required>${e(q?.question_text||'')}</textarea></div>${[1,2,3,4,5].map(n=>`<div class="field"><label>보기 ${n}</label><input class="inp" name="c${n}" value="${e(q?.['choice_'+n]||'')}"></div>`).join('')}<div class="field"><label>해설</label><textarea class="ta" name="x">${e(q?.explanation||'')}</textarea></div><button class="btn pri full" style="margin-top:15px">저장</button></form>`);m.querySelector('#qf').onsubmit=async x=>{x.preventDefault();let f=new FormData(x.currentTarget),p={id:q?.id,exam_id:examId,question_no:Number(f.get('n')),question_text:f.get('t'),correct_choice:Number(f.get('a')),explanation:f.get('x'),points:1};for(let n=1;n<=5;n++)p['choice_'+n]=f.get('c'+n)||null;await admin({action:'save_question',question:p});toast('저장했습니다.');m.remove();parent.remove();questions(examId,null)}}
async function openSubject(id){S.subject=S.subjects.find(x=>x.id===id);let {data}=await sb.from('cbt_exams').select('*').eq('subject_id',id).eq('is_published',true).order('year',{ascending:false});S.exams=data||[];S.view='subject';render()}
async function startExam(id){S.exam=S.exams.find(x=>x.id===id);let {data:qs,error}=await sb.from('cbt_questions').select('id,workspace_id,exam_id,question_no,question_text,choice_1,choice_2,choice_3,choice_4,choice_5,image_path,points').eq('exam_id',id).order('question_no');if(error||!qs?.length)return toast(error?.message||'문제가 없습니다.');let {data:a,error:er}=await sb.from('cbt_attempts').insert({workspace_id:S.ws.id,exam_id:id,user_id:S.session.user.id,status:'in_progress'}).select('id,exam_id,user_id,status,started_at').single();if(er)return toast(er.message);S.qs=qs;S.attempt=a;S.answers={};S.qi=0;S.view='exam';render()}
async function saveAnswer(ch){let q=S.qs[S.qi];S.answers[q.id]=ch;render();await sb.from('cbt_answers').upsert({attempt_id:S.attempt.id,question_id:q.id,user_id:S.session.user.id,selected_choice:ch,answered_at:new Date().toISOString()},{onConflict:'attempt_id,question_id'})}
async function submit(){let u=S.qs.filter(q=>!S.answers[q.id]).length;if(u&&!confirm('아직 '+u+'문제를 풀지 않았습니다. 제출할까요?'))return;let {data,error}=await sb.functions.invoke('cbt-grade',{body:{attempt_id:S.attempt.id}});if(error||data?.error)return toast('채점 실패');S.result=data;S.view='result';await base();render()}
sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){S.session=null;S.p=null;login()}else if(s)S.session=s});
boot();
</script></body></html>
